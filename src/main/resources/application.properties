spring.application.name=relay4u-auth-service-be
spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eu_relay_4u_auth_service}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=db/changelog/db.changelog-master.yaml
spring.profiles.active=${SPRING_PROFILES_ACTIVE:sandbox}

jwt.expiration.in.hours=${JWT_EXPIRATION_HOURS:2}
jwt.issuer=${JWT_ISSUER:https://auth.relay4u.eu}
jwt.private-key=${JWT_PRIVATE_KEY:}

# Security Hardening
security.password.pepper=${PASSWORD_PEPPER:super-secret-pepper-change-me-in-prod}
security.lockout.max-attempts=5
security.lockout.duration-minutes=10

# CORS
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}

# Resend Email Service
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}

# Email Verification
verification.code.expiry-minutes=15
verification.code.max-attempts=5
verification.resend.max-per-hour=3
verification.expose-code-in-response=${VERIFICATION_EXPOSE_CODE:false}
