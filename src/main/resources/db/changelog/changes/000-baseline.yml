databaseChangeLog:
    - changeSet:
          id: 000-baseline-users
          author: KG
          changes:
              - createTable:
                    tableName: users
                    columns:
                        - column:
                              name: id
                              type: BIGINT
                              autoIncrement: true
                              constraints:
                                  primaryKey: true
                                  nullable: false
                        - column:
                              name: name
                              type: VARCHAR(255)
                              constraints:
                                  nullable: false
                        - column:
                              name: email
                              type: VARCHAR(255)
                              constraints:
                                  nullable: false
                                  unique: true
                                  uniqueConstraintName: uc_users_email
                        - column:
                              name: password
                              type: VARCHAR(255)
                        - column:
                              name: created_at
                              type: TIMESTAMP
                              constraints:
                                  nullable: false
                        - column:
                              name: is_deleted
                              type: BOOLEAN
                              defaultValueBoolean: false
                              constraints:
                                  nullable: false
                        - column:
                              name: failed_login_attempts
                              type: INT
                              defaultValueNumeric: 0
                              constraints:
                                  nullable: false
                        - column:
                              name: account_locked
                              type: BOOLEAN
                              defaultValueBoolean: false
                              constraints:
                                  nullable: false
                        - column:
                              name: lock_time
                              type: TIMESTAMP
                        - column:
                              name: email_verified
                              type: BOOLEAN
                              defaultValueBoolean: false
                              constraints:
                                  nullable: false
                        - column:
                              name: verification_code
                              type: VARCHAR(255)
                        - column:
                              name: verification_code_expiry
                              type: TIMESTAMP
                        - column:
                              name: verification_attempts
                              type: INT
                              defaultValueNumeric: 0
                              constraints:
                                  nullable: false
                        - column:
                              name: resend_count
                              type: INT
                              defaultValueNumeric: 0
                              constraints:
                                  nullable: false
                        - column:
                              name: last_resend_at
                              type: TIMESTAMP